context.modules = [
    # ----------------------------------------------------------------
    # Tidal-Combined-Sink: Audio läuft parallel an
    #   1. Fosi Audio ZH3 (zum Hören)
    #   2. sink_rode_music (für Pegel-Anzeige am RØDECaster Music-Channel)
    # Die MIDI-Bridge regelt die Tidal-interne Lautstärke über das
    # Music-Fader (jetzt MIDI-Function), während sink_rode_music nur als
    # Visualisierung dient (RodeCaster-Music-Fader regelt NICHT mehr Audio).
    # ----------------------------------------------------------------
    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name        = "sink_tidal_combined"
            node.description = "Tidal (Fosi + RØDE Musik)"
            combine.props = {
                audio.position = [ FL FR ]
            }
            stream.props = {
            }
            stream.rules = [
                {
                    matches = [
                        { node.name = "alsa_output.usb-Fosi_Fosi_Audio_ZH3-00.analog-stereo" }
                    ]
                    actions = { create-stream = { } }
                }
                {
                    matches = [
                        { node.name = "sink_rode_music" }
                    ]
                    actions = { create-stream = { } }
                }
            ]
        }
    }
]
