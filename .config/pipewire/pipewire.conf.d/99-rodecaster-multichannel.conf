context.modules = [
    # ----------------------------------------------------------------
    # 1. GAME SINK -> Geht auf RØDECaster AUX 2 & 3
    # ----------------------------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "RØDE Game"
            capture.props = {
                node.name      = "sink_rode_game"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                # Ziel: RØDECaster Hardware
                node.target    = "alsa_output.usb-R__DE_RODECaster_Duo_IR0050002-00.pro-output-1"
                # Mapping: Wir senden an AUX2 und AUX3 der Hardware
                audio.position = [ AUX2 AUX3 ]
                node.passive   = true
            }
        }
    }

    # ----------------------------------------------------------------
    # 2. MUSIC SINK -> Geht auf RØDECaster AUX 4 & 5
    # ----------------------------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "RØDE Musik"
            capture.props = {
                node.name      = "sink_rode_music"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.target    = "alsa_output.usb-R__DE_RODECaster_Duo_IR0050002-00.pro-output-1"
                audio.position = [ AUX4 AUX5 ]
                node.passive   = true
            }
        }
    }

    # ----------------------------------------------------------------
    # 3. VIRTUAL A (Chat/Voice) -> Geht auf RØDECaster AUX 6 & 7
    # ----------------------------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "RØDE Virtual A"
            capture.props = {
                node.name      = "sink_rode_virtuala"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.target    = "alsa_output.usb-R__DE_RODECaster_Duo_IR0050002-00.pro-output-1"
                audio.position = [ AUX6 AUX7 ]
                node.passive   = true
            }
        }
    }

    # ----------------------------------------------------------------
    # 4. BROWSER (Virtual B) -> Geht auf RØDECaster AUX 8 & 9
    # ----------------------------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "RØDE Browser"
            capture.props = {
                node.name      = "sink_rode_browser"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.target    = "alsa_output.usb-R__DE_RODECaster_Duo_IR0050002-00.pro-output-1"
                audio.position = [ AUX8 AUX9 ]
                node.passive   = true
            }
        }
    }
    # ----------------------------------------------------------------
    # 5. RØDECaster Mix -> Fosi Audio ZH3 (Listen to this device)
    # ----------------------------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Rode to Fosi Loopback"
            # Verhindert, dass das Modul bei Stille in den Standby geht:
            node.pause-on-idle = false

            capture.props = {
                node.target = "alsa_input.usb-R__DE_RODECaster_Duo_IR0050002-00.pro-input-0"
                audio.position = [ FL FR ]
                # Auch den Capture-Stream wach halten:
                node.pause-on-idle = false
            }
            playback.props = {
                node.target = "alsa_output.usb-Fosi_Fosi_Audio_ZH3-00.analog-stereo"
                audio.position = [ FL FR ]
                node.passive = true
                # Auch den Playback-Stream wach halten:
                node.pause-on-idle = false
            }
        }
    }

    # ----------------------------------------------------------------
    # 6. MUSIK-COMBINED-SINK
    #    Virtuelle Senke, in die der Musik-Player (Spotify/Chromium) spielt.
    #    Wird per zwei Loopbacks an Fosi (hörbar) und sink_rode_music
    #    (Pegel-Anzeige auf dem RØDECaster Music-Channel) gefächert.
    #
    #    Steht bewusst in dieser Datei (nicht in 98-...), weil 6b auf
    #    sink_rode_music angewiesen ist. node.target wird zwar dynamisch
    #    aufgelöst, aber die Topologie bleibt so an einer Stelle.
    #
    #    Hintergrund: das vorherige libpipewire-module-combine-stream
    #    hat die Regel für sink_rode_music beim Boot nur einmal
    #    ausgewertet, BEVOR Loopback 2 die Senke registriert hatte —
    #    -> "target not found" und kein Stream zum RØDECaster.
    #
    #    6a: sink_music_combined (Null-Sink-Pattern via Loopback)
    # ----------------------------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Musik Combined (Sink)"
            capture.props = {
                node.name        = "sink_music_combined"
                node.description = "Musik (Fosi + RØDE Musik)"
                media.class      = "Audio/Sink"
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.target    = "alsa_output.usb-Fosi_Fosi_Audio_ZH3-00.analog-stereo"
                audio.position = [ FL FR ]
                node.passive   = true
            }
        }
    }

    # 6b: sink_music_combined.monitor -> sink_rode_music (Visualisierung)
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Musik Combined -> RØDE Musik"
            capture.props = {
                node.target         = "sink_music_combined"
                stream.capture.sink = true
                audio.position      = [ FL FR ]
            }
            playback.props = {
                node.target    = "sink_rode_music"
                audio.position = [ FL FR ]
                node.passive   = true
            }
        }
    }
]
