# Lässt PipeWire die Graph-Clock an die Quelle anpassen, statt alles
# auf eine feste Rate zu resampeln. Die Fosi ZH3 kann bis 768 kHz,
# aber höhere Raten als 192k bringen keinen hörbaren Vorteil und kosten
# nur CPU. PipeWire wechselt nur, wenn das Gerät idle ist; Geräte, die
# eine Rate nicht können (RODECaster = nur 48k), resampeln dann.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
