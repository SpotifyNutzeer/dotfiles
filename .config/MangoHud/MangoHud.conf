# MangoHud — Catppuccin Mocha, passend zum Quickshell/Hyprland-Look
# Farben aus .config/quickshell/Theme.qml (Mocha-Variante) / .config/hypr/mocha.conf

### Verhalten ##################################################################
# non-legacy Layout: Zeilen-Reihenfolge = Anzeige-Reihenfolge; außerdem
# Voraussetzung für custom_text/exec (X3D-Anzeige unten)
legacy_layout=false
# kein HUD auf dem gamescope-Compositor selbst (MANGOHUD=1 kommt global
# aus steam-env.conf und würde sonst doppelt rendern)
blacklist=gamescope
position=top-left
# wie die Quickshell-Islands: 10px vom Rand abgesetzt
offset_x=10
offset_y=10
toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
# Shift_L+F1 schaltet durch: unbegrenzt -> 120 -> 60 fps
fps_limit=0,120,60
fps_limit_method=late
toggle_fps_limit=Shift_L+F1
# Logging nur manuell per Shift_L+F2 (autostart_log + control-Socket waren
# MangoJuice-Reste ohne Konsumenten)
toggle_logging=Shift_L+F2
output_folder=/tmp/mangohud
log_interval=100

### Look & Feel (Catppuccin Mocha) #############################################
# Nix-Store-Pfad, kein stabiler Font-Pfad auf NixOS vorhanden; fehlt die Datei
# nach einem Font-Update, fällt MangoHud auf die eingebaute Font zurück
font_file=/nix/store/bklz49kjsxvpbargjdpphc6gwwn67vmx-nerd-fonts-jetbrains-mono-3.4.0+2.304/share/fonts/truetype/NerdFonts/JetBrainsMono/JetBrainsMonoNerdFont-Regular.ttf
round_corners=12
background_color=1e1e2e
background_alpha=0.8
text_color=cdd6f4
text_outline
text_outline_color=11111b
horizontal_separator_color=45475a

### Anzeige (Reihenfolge = Layout) #############################################
# Uhr (wie in der Bar, in Vollbild-Spielen sonst unsichtbar)
time
time_format=%H:%M

# GPU (RTX 4090; Lüfter in %, gpu_voltage ist AMD-only und entfällt)
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_fan
vram
gpu_load_change
gpu_load_value=60,90
gpu_load_color=a6e3a1,f9e2af,f38ba8
gpu_color=94e2d5
throttling_status

# CPU (9950X3D; core_load+core_bars = Histogramm der Last pro Kern -> man
# sieht, welches CCD arbeitet; cpu_power braucht die RAPL-udev-Rule aus
# lib/gaming.sh)
cpu_stats
cpu_temp
cpu_power
cpu_mhz
cpu_load_change
cpu_load_value=60,90
cpu_load_color=a6e3a1,f9e2af,f38ba8
cpu_color=a6e3a1
core_load
core_bars

# aktueller X3D-Modus des amd_x3d_vcache-Treibers: "cache" oder "frequency"
custom_text=X3D
exec=cat /sys/devices/platform/AMDI0101:00/amd_x3d_mode

# Speicher
ram
swap
procmem
ram_color=cba6f7
vram_color=b4befe

# Disk-I/O + Netzwerk
io_read
io_write
io_color=74c7ec
network=enp14s0
network_color=89b4fa

# FPS
fps
fps_metrics=avg,0.01,0.001
fps_color_change
fps_value=30,60
fps_color=f38ba8,f9e2af,a6e3a1
frametime
# aktueller Vulkan-Present-Mode (Fifo = VSync, Mailbox/Immediate = uncapped)
present_mode
# nur unter gamescope sichtbar:
refresh_rate
fsr
hdr

# Status / Systeminfo
gamemode
gpu_name
engine_version
engine_short_names
vulkan_driver
wine
winesync
engine_color=f38ba8
wine_color=f38ba8

# Frametime-Graph (Sky als Haupt-Akzent, wie die Quickshell-MiniGraphs)
frame_timing
frame_timing_detailed
frametime_color=89dceb

# Akku von Maus/Gamepad (Logitech HID++ wird erkannt)
device_battery=gamepad,mouse
device_battery_icon

# optional: Medien-Anzeige wie das Musik-Island (bei Bedarf einkommentieren)
# media_player
media_player_format={title};{artist};{album}
media_player_color=f5c2e7
