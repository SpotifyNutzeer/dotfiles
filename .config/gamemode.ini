[general]
renice=0

[cpu]
; 9950X3D: Kerne nicht parken, Spiel auf Kerne pinnen.
park_cores=no
pin_cores=yes

[custom]
; X3D: beim Spielen das Cache-CCD bevorzugen, danach zurück aufs Frequenz-CCD.
; /usr/local/bin/x3d-mode + sudoers-Drop-in installiert lib/gaming.sh.
start=sudo /usr/local/bin/x3d-mode cache
end=sudo /usr/local/bin/x3d-mode frequency
