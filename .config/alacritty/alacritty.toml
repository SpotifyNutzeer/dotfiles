general.import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

[window]
opacity = 0.85
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "Full"

[font]
size = 11.0

[font.normal]
family = "MesloLGS Nerd Font Mono"
style  = "Regular"

[font.bold]
family = "MesloLGS Nerd Font Mono"
style  = "Bold"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style  = "Italic"

[font.bold_italic]
family = "MesloLGS Nerd Font Mono"
style  = "Bold Italic"

[scrolling]
history    = 50000
multiplier = 3

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
