# Gaming-Env-Defaults für Steam/Proton (proton-cachyos) — wird vom
# steam-Wrapper (bin/steam -> ~/.local/bin/steam) beim Start geladen.
# Alle Spiele erben diese Variablen; als Launch-Option pro Spiel bleibt nur
# noch 'gamemoderun %command%' bzw. die gamescope-Vorlage (launchsteamgame.sh).
#
# Format: sh-Syntax (KEY=VALUE), wird mit 'set -a' gesourct.

# MangoHud in allen Vulkan-Spielen (Toggle: Shift_R+F12)
MANGOHUD=1

# Wine-Audio-Knistern vermeiden (Pulse/pipewire-pulse-Latenz)
PULSE_LATENCY_MSEC=60

# Proton: natives Wayland + HDR (Hyprland); DXVK_HDR für den gamescope-Pfad
PROTON_ENABLE_WAYLAND=1
PROTON_ENABLE_HDR=1
DXVK_HDR=1

# DLSS: DLLs automatisch upgraden, NVAPI + NGX-Updater aktiv
PROTON_DLSS_UPGRADE=1
PROTON_ENABLE_NVAPI=1
PROTON_ENABLE_NGX_UPDATER=1

# NVIDIA-Libs im Prefix verfügbar machen (PhysX, CUDA)
PROTON_NVIDIA_LIBS=1

# Shader-Cache pro Spiel isolieren
PROTON_LOCAL_SHADER_CACHE=1

# ntsync statt fsync (braucht /dev/ntsync, Kernel 6.14+)
PROTON_USE_NTSYNC=1

# vkd3d-proton: Descriptor-Heap-Pfad — fixt u.a. NVIDIA-Xid-109-Crashes
PROTON_VKD3D_HEAP=1
VKD3D_CONFIG=descriptor_heap

# NVIDIA: GL-Shader-Cache nicht periodisch aufräumen
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
